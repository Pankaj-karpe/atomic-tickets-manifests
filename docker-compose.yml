version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@PANKAJkarpe1"
      POSTGRES_DB: AtomicTicket
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: pankajkarpe1/atomic-tickets-pt:latest
    restart: unless-stopped
    env_file: .env 
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  worker:
    image: pankajkarpe1/atomic-tickets-pt:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: ["python3", "-m", "celery", "-A", "app.celeryapp", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
  beat:
    image: pankajkarpe1/atomic-tickets-pt:latest
    restart: unless-stopped
    env_file: .env
    entrypoint: ["python3", "-m", "celery", "-A", "app.celeryapp", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
