apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: at
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh 
            - -c
            - until pg_isready -h postgres -p 5432 -U postgres; do sleep 2; done
      containers:
        - name: backend
          image: pankajkarpe1/atomic-tickets-pt:b3df5b4
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: atomic-tickets-config
            - secretRef: 
                name: atomic-tickets-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 60}
        - setWeight: 50
        - pause: {duration: 60}
        - setWeight: 75
        - pause: {duration: 100}

---
apiVersion: v1 
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
