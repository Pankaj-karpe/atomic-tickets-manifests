version: "3.9"

services:
  frontend:
    build:
      context: ./frontend_p2
      dockerfile: ../Dockerfile.frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost/api-direct"
      NEXT_PUBLIC_WS_URL: "ws://localhost/ws"
    expose:
      - "3000"


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend_p2/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
